<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Monthly Budget</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#142033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:680px;margin:auto;padding:20px 14px 40px}h1{margin:4px 0}.sub,.cat,.note{color:#687386}.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c,.bill{background:#fff;border-radius:17px;padding:14px;box-shadow:0 2px 12px #17255412}.wide{grid-column:1/-1}.lab{font-size:13px;color:#687386}.money{font-size:25px;font-weight:800;margin-top:4px}.green{color:#15803d}.amber{color:#c26708}h2{margin:24px 2px 8px}.bill{display:grid;grid-template-columns:1fr auto;align-items:center;margin:8px 0}.name,.amt{font-weight:750}.cat{font-size:12px;margin-top:3px}.r{text-align:right}button{border:0;border-radius:11px;padding:9px 12px;font:inherit;font-weight:700}.pay{background:#eef2ff;color:#2563eb}.paid{background:#dcfce7;color:#15803d}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.buttons button{padding:13px}.edit{background:#e0e7ff;color:#3730a3}.reset{background:#fee2e2;color:#b91c1c}.note{text-align:center;font-size:12px;margin-top:15px}dialog{border:0;border-radius:18px;width:min(92vw,430px);padding:18px}dialog::backdrop{background:#0007}input{width:100%;padding:11px;margin:5px 0 11px;border:1px solid #d5dbe6;border-radius:10px;font:inherit}.save,.close{width:100%;padding:12px;margin-top:8px}.save{background:#2563eb;color:white}.close{background:#eee}</style></head>
<body><div class="w"><h1>Monthly Budget</h1><div class="sub" id="month"></div><div class="sum">
<div class="c"><div class="lab">Income</div><div class="money" id="inc"></div></div><div class="c"><div class="lab">Commitments</div><div class="money" id="tot"></div></div>
<div class="c"><div class="lab">Paid / set aside</div><div class="money green" id="pd"></div></div><div class="c"><div class="lab">Still to pay</div><div class="money amber" id="due"></div></div>
<div class="c wide"><div class="lab">Left after all commitments</div><div class="money green" id="left"></div></div></div>
<h2>Bills & commitments</h2><div id="list"></div><div class="buttons"><button class="edit" onclick="openEdit()">Edit amounts</button><button class="reset" onclick="resetM()">Reset month</button></div>
<div class="note">Saved privately in this browser on this device.</div></div>
<dialog id="editor"><h2>Edit budget</h2><label>Monthly income</label><input id="ie" type="number" inputmode="decimal"><div id="eb"></div><button class="save" onclick="saveEdit()">Save changes</button><button class="close" onclick="editor.close()">Cancel</button></dialog>
<script>
const D={income:3000,bills:[["Tapo",10,"Subscriptions",0],["Prime",10,"Subscriptions",0],["Shed",67,"Other",0],["Phone / Wi-Fi",103,"Phone & Internet",0],["Rent",700,"Home",0],["DVLA",100,"Car",0],["Car",395,"Car",0],["Gas / Electric",130,"Utilities",1],["Council Tax",140,"Home",1],["Storage",3,"Other",1],["Water",30,"Utilities",1],["Holiday 1",110,"Savings / Holiday",1],["Apple Music",11,"Subscriptions",1],["Ring",5,"Subscriptions",1],["Holiday 2",172,"Savings / Holiday",1],["Insurance",150,"Car · Ends December 2026",1]]};
let d;try{d=JSON.parse(localStorage.getItem("budget-v1"))||D}catch(e){d=D}
const gbp=n=>new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits:2}).format(n);
function save(){localStorage.setItem("budget-v1",JSON.stringify(d))}
function render(){month.textContent=new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"});let t=d.bills.reduce((a,b)=>a+ +b[1],0),p=d.bills.filter(b=>b[3]).reduce((a,b)=>a+ +b[1],0);inc.textContent=gbp(d.income);tot.textContent=gbp(t);pd.textContent=gbp(p);due.textContent=gbp(t-p);left.textContent=gbp(d.income-t);list.innerHTML=d.bills.map((b,i)=>'<div class="bill"><div><div class="name">'+b[0]+'</div><div class="cat">'+b[2]+'</div></div><div class="r"><div class="amt">'+gbp(b[1])+'</div><button class="'+(b[3]?'paid':'pay')+'" onclick="toggle('+i+')">'+(b[3]?'✓ Paid':'Mark paid')+'</button></div></div>').join("");save()}
function toggle(i){d.bills[i][3]=!d.bills[i][3];render()} function resetM(){if(confirm("Mark all bills unpaid for a new month?")){d.bills.forEach(b=>b[3]=0);render()}}
function openEdit(){ie.value=d.income;eb.innerHTML=d.bills.map((b,i)=>'<label>'+b[0]+'</label><input data-i="'+i+'" type="number" inputmode="decimal" value="'+b[1]+'">').join("");editor.showModal()}
function saveEdit(){d.income=+ie.value||0;eb.querySelectorAll("input").forEach(x=>d.bills[+x.dataset.i][1]=+x.value||0);editor.close();render()}render();
</script></body></html>
