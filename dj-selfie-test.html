<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ Request Queue</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111 url('old-star-background.png') center center / cover fixed no-repeat;
  color:#fff;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
  background:rgba(0,0,0,0.55);
  border-radius:18px;
}


.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

h1{
  margin:0;
  font-size:28px;
}

.status{
  font-size:14px;
  color:#7cff9b;
}

.tabs{
  display:flex;
  gap:8px;
  margin:18px 0 10px;
}

.tabs button{
  border:0;
  border-radius:9px;
  padding:11px 18px;
  font-weight:bold;
  cursor:pointer;
  background:#333;
  color:#fff;
}

.tabs button.active{
  background:#f0b400;
  color:#111;
}

.filters{
  display:flex;
  gap:8px;
  margin:10px 0 18px;
  flex-wrap:wrap;
}

.filters button{
  border:0;
  border-radius:20px;
  padding:8px 14px;
  background:#333;
  color:#fff;
  cursor:pointer;
}

.filters button.active{
  background:#555;
}

.card{
  background:#1d1d1d;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  border-left:5px solid #f0b400;
}

.card.history{
  border-left-color:#777;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.meta{
  color:#bbb;
  margin-top:6px;
  font-size:14px;
}

.msg{
  margin-top:8px;
  color:#ddd;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#333;
  font-size:12px;
  margin-bottom:8px;
}

.status-pill{
  background:#333;
}

button.action{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  margin:8px 4px 0 0;
  font-weight:bold;
  cursor:pointer;
}

.approve{background:#39d98a;color:#111}
.reject{background:#ff6575;color:#111}
.played{background:#42a5f5;color:#111}

.empty{
  color:#999;
  text-align:center;
  padding:50px 10px;
}

.refresh{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  background:#333;
  color:#fff;
  cursor:pointer;
}
.private-selfie{max-width:160px;max-height:160px;object-fit:contain;float:right;margin:0 0 12px 18px}.photo-delete{float:right;clear:right}.staff-auth-error{color:#ffb4b4}input{font:inherit;max-width:95%;padding:10px}label{display:block;margin:12px 0}.card:after{content:"";display:block;clear:both}</style>
</head>

<body><section id="staffLogin" style="max-width:480px;margin:30px auto;padding:24px"><h1>DJ staff sign-in</h1><p>Sign in once on this staff device. Photos are private and never emailed.</p><form id="staffForm"><label>Email <input id="staffEmail" type="email" autocomplete="username" required></label><br><label>Password <input id="staffPassword" type="password" autocomplete="current-password" required></label><p><button type="submit">Sign in</button> <button id="staffCreate" type="button">Set up staff account</button></p></form><p id="staffNotice" role="status"></p></section><div id="staffTools" hidden><button id="staffLogout">Sign out &amp; clear photos</button><span id="photoHealth"></span></div>
<div class="wrap" id="staffApp" hidden>

  <div class="top">
    <div>
      <h1>🎧 DJ Request Queue</h1>
      <div id="status" class="status">Connecting...</div>
    </div>

    <button class="refresh" onclick="load()">↻ Refresh</button>
  </div>

  <div class="tabs">
    <button id="queueTab" class="active" onclick="setPage('queue')">
      📋 Queue
    </button>

    <button id="historyTab" onclick="setPage('history')">
      🕘 History
    </button>
    <button id="clearHistoryBtn" onclick="clearHistory()" style="display:none;background:#c62828;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:bold;cursor:pointer;margin-left:8px;">
🗑 Clear History
</button>
  </div>

  <div class="filters">
    <button id="allFilter" class="active" onclick="setFilter('all')">All</button>
    <button id="songFilter" onclick="setFilter('song')">🎵 Songs</button>
    <button id="karaokeFilter" onclick="setFilter('karaoke')">🎤 Karaoke</button>
  </div>

  <div id="queue"></div>

</div>

<script src="kiosk-config.js"></script><script>window.OLDSTAR_DJ_READ_ONLY=true;</script><script src="selfie-pilot-dj-auth.js"></script></body></html>
