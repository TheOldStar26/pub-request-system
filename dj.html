<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ Request Queue</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0}.status{color:#7ee29b;font-size:13px}
.card{background:#1d1d1d;border-radius:14px;padding:16px;margin:12px 0;border-left:5px solid #f0b400}.k{border-left-color:#c85cff}
.title{font-size:20px;font-weight:bold;margin:7px 0}.meta{color:#aaa;font-size:14px}.msg{color:#ddd;margin:8px 0}
button{border:0;border-radius:8px;padding:10px 13px;margin:3px;font-weight:bold;cursor:pointer}.ok{background:#39b96b}.no{background:#d34d4d;color:#fff}.done{background:#4778d8;color:#fff}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#333;font-size:12px}.empty{text-align:center;color:#aaa;padding:40px}
.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{background:#333;color:#fff}.tabs button.active{background:#f0b400;color:#111}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>🎧 DJ Request Queue</h1><div id="status" class="status">Connecting…</div></div></div>
<div class="tabs"><button id="all" class="active">All</button><button id="songs">🎵 Songs</button><button id="karaoke">🎤 Karaoke</button></div>
<div id="queue"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nhmamyhkutirwtenpyzw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4h9IT2qjyvTgLlHq_Fd18g_MuliWIGj";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let filter="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function load(){
 const {data,error}=await sb.from("requests").select("*").in("status",["pending","approved"]).order("created_at",{ascending:true});
 if(error){document.getElementById("status").textContent="Database connection error";return}
 document.getElementById("status").textContent="● Live";
 const x=filter==="all"?data:data.filter(r=>r.type===filter);
 document.getElementById("queue").innerHTML=x.length?x.map(r=>`<div class="card ${r.type==="karaoke"?"k":""}">
 <span class="pill">${r.type==="karaoke"?"🎤 KARAOKE":"🎵 SONG"}</span>
 <div class="title">${esc(r.title)}${r.artist?" — "+esc(r.artist):""}</div>
 <div class="meta">Requested by ${esc(r.name)} · ${new Date(r.created_at).toLocaleString()}</div>
 ${r.message?`<div class="msg">${esc(r.message)}</div>`:""}
 <div>${r.status==="pending"?`<button class="ok" onclick="act('${r.id}','approved')">Approve</button>`:"<span class='pill'>APPROVED</span>"}
 <button class="no" onclick="act('${r.id}','rejected')">Reject</button>
 <button class="done" onclick="act('${r.id}','played')">Played</button></div></div>`).join(""):"<div class='empty'>No requests waiting.</div>";
}
async function act(id,status){const {error}=await sb.from("requests").update({status}).eq("id",id);if(!error)load()}
document.getElementById("all").onclick=()=>set("all");document.getElementById("songs").onclick=()=>set("song");document.getElementById("karaoke").onclick=()=>set("karaoke");
function set(v){filter=v;document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));document.getElementById(v==="all"?"all":v==="song"?"songs":"karaoke").classList.add("active");load()}
sb.channel("request-changes").on("postgres_changes",{event:"*",schema:"public",table:"requests"},()=>load()).subscribe();
load();
</script></body></html>
